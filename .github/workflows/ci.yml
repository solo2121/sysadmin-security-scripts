# =============================================================================
# Security Engineering Lab — CI Pipeline
# =============================================================================
#
# Jobs:
#   validate-vagrantfiles  — syntax check all three Vagrantfiles
#   lint-shell-scripts     — shellcheck errors only (not warnings)
#   lint-python-scripts    — syntax check only (flake8 informational)
#   security-scan          — bandit informational only (never blocks)
#   run-tests              — pytest (Python), bats (Bash), and repo health checks
#   check-doc-links        — markdown link check (informational) + doc-index
#                            reference check (blocks — local, no network)
#
# Philosophy:
#   Only REAL errors block the build. Style warnings and security
#   findings in intentional pentest scripts are reported but do not
#   fail the pipeline.
#
# =============================================================================

name: CI

on:
  push:
    branches:
      - main
      - chore/repository-standardization
  pull_request:
    branches:
      - main

# Least-privilege default: this pipeline only needs to read the repo.
# Individual jobs can widen this if a future job needs to write (e.g.
# posting a check run or comment) — none currently do.
permissions:
  contents: read

jobs:

  # ---------------------------------------------------------------------------
  # Job 1: Validate all three Vagrantfiles
  # ---------------------------------------------------------------------------
  validate-vagrantfiles:
    name: Validate Vagrantfiles
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Vagrant
        run: |
          wget -O - https://apt.releases.hashicorp.com/gpg \
            | sudo gpg --dearmor \
                -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) \
            signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] \
            https://apt.releases.hashicorp.com $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential \
            libvirt-dev \
            pkg-config \
            qemu-utils \
            vagrant

      - name: Install Vagrant plugins
        run: |
          vagrant plugin install vagrant-reload
          vagrant plugin install vagrant-libvirt
          vagrant plugin list

      - name: Validate AD Pentest Vagrantfile
        run: vagrant validate
        working-directory: labs/security/active-directory/base
        env:
          VAGRANT_DEFAULT_PROVIDER: libvirt

      - name: Validate AD Pentest VLAN Vagrantfile
        run: vagrant validate
        working-directory: labs/security/active-directory/vlan-segmented
        env:
          VAGRANT_DEFAULT_PROVIDER: libvirt

      - name: Validate DevOps Lab Vagrantfile
        run: vagrant validate
        working-directory: labs/infrastructure/devops-linux-lab
        env:
          VAGRANT_DEFAULT_PROVIDER: libvirt

  # ---------------------------------------------------------------------------
  # Job 2: Shell script linting — errors only, not style warnings
  # ---------------------------------------------------------------------------
  lint-shell-scripts:
    name: Lint Shell Scripts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Run shellcheck (errors only)
        run: |
          echo "Scanning shell scripts for errors..."
          FAILED=0
          CHECKED=0

          while IFS= read -r -d '' script; do
            CHECKED=$((CHECKED + 1))
            # SC1091 — not following sourced file (expected in lab scripts)
            # SC2086 — double quote to prevent globbing (too noisy)
            # SC2034 — variable appears unused (false positives in sourced scripts)
            # SC2155 — declare and assign separately (style, not error)
            # SC2164 — use cd ... || exit (style)
            # SC2181 — check exit code directly (style)
            # SC2207 — mapfile not available everywhere (portability warning)
            if ! shellcheck \
              --severity=error \
              --exclude=SC1091,SC2086,SC2034,SC2155,SC2164,SC2181,SC2207 \
              "$script" 2>&1; then
              echo "FAILED: $script"
              FAILED=1
            fi
          done < <(find . -name "*.sh" -not -path "./.git/*" -print0)

          echo "Checked $CHECKED shell scripts"
          if [ "$FAILED" -eq 1 ]; then
            echo "shellcheck found real errors — fix them before merging"
            exit 1
          fi
          echo "All shell scripts passed"

  # ---------------------------------------------------------------------------
  # Job 3: Python syntax check — style warnings are informational only
  # ---------------------------------------------------------------------------
  lint-python-scripts:
    name: Lint Python Scripts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install tools
        run: pip install flake8 --quiet

      - name: Syntax check — blocks on real errors
        run: |
          echo "Checking Python syntax..."
          FAILED=0
          CHECKED=0

          while IFS= read -r -d '' script; do
            CHECKED=$((CHECKED + 1))
            if ! python3 -m py_compile "$script" 2>&1; then
              echo "SYNTAX ERROR: $script"
              FAILED=1
            fi
          done < <(find . -name "*.py" -not -path "./.git/*" -print0)

          echo "Checked $CHECKED Python files"
          if [ "$FAILED" -eq 1 ]; then
            echo "Fix syntax errors before merging"
            exit 1
          fi
          echo "All Python files have valid syntax"

      - name: Style check — informational only (never blocks)
        run: |
          echo "Running flake8 style check (informational)..."
          flake8 \
            --max-line-length=120 \
            --extend-ignore=E501,W503,E302,E303,W291,W293,E711,E712,\
          E128,W292,F401,E722,F811,E305 \
            --exclude=.git,__pycache__ \
            $(find . -name "*.py" -not -path "./.git/*") \
            || true
          echo "Flake8 complete (warnings above are informational)"

  # ---------------------------------------------------------------------------
  # Job 4: Bandit security scan — always informational, never blocks
  #
  # Pentest and security tooling intentionally uses patterns that bandit
  # flags (telnet, paramiko, shell=True). These are expected and reviewed.
  # The scan runs to surface unintentional issues, not to block CI.
  # ---------------------------------------------------------------------------
  security-scan:
    name: Security Scan (Python)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install bandit
        run: pip install bandit --quiet

      - name: Run bandit (informational — never blocks)
        run: |
          echo "Running bandit security scan (informational only)..."
          PY_FILES=$(find . -name "*.py" -not -path "./.git/*" | tr '\n' ' ')

          if [ -z "$PY_FILES" ]; then
            echo "No Python files found"
            exit 0
          fi

          # Run bandit but always exit 0 — findings are informational.
          # Security scripts in this repo intentionally use patterns
          # that bandit flags (telnet, paramiko, shell execution).
          # These are reviewed during code review, not blocked in CI.
          bandit \
            --recursive \
            --severity-level medium \
            --confidence-level medium \
            --exclude ./.git \
            --format txt \
            $PY_FILES 2>&1 || true

          echo "Bandit scan complete (see findings above for review)"
          exit 0

  # ---------------------------------------------------------------------------
  # Job 4b: Modern Python tooling — ruff/black/mypy, informational only
  #
  # flake8 (Job 3) remains the tool that's actually tuned and relied on.
  # ruff/black/mypy are offered as opt-in developer tooling (see `make
  # format` / `make typecheck`, config in pyproject.toml) and reported here
  # for visibility, but — like bandit — never block the pipeline.
  # ---------------------------------------------------------------------------
  modern-python-tooling:
    name: Ruff / Black / Mypy (informational — never blocks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install tools
        run: pip install ruff black mypy --quiet

      - name: ruff check (informational)
        run: ruff check . || true

      - name: black --check (informational)
        run: black --check . || true

      - name: mypy on tools/lib (informational — the only module held to a typed standard so far)
        run: mypy tools/lib || true

  # ---------------------------------------------------------------------------
  # Job 5: Automated test suites — pytest (Python) and bats (Bash)
  # ---------------------------------------------------------------------------
  run-tests:
    name: Run Test Suites
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install pytest
        run: pip install pytest pytest-cov --quiet

      - name: Run Python unit tests
        run: pytest tests/python/ -v

      - name: "Python coverage report (enforced minimum: 80%)"
        run: |
          pytest tests/python/ --cov=. --cov-report=term-missing --cov-fail-under=80

      - name: Install bats
        run: sudo apt-get update -qq && sudo apt-get install -y bats

      - name: Run Bash unit tests
        run: bats tests/bash/

      - name: Repository health validation
        run: |
          echo "Running scripts/validate_lab.py (Vagrant checks skipped — covered by the validate-vagrantfiles job)"
          python3 scripts/validate_lab.py --skip-vagrant

  # ---------------------------------------------------------------------------
  # Job 6: Markdown link check — catch broken internal doc references
  # ---------------------------------------------------------------------------
  check-doc-links:
    name: Check Doc Links and References
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Check doc-index bullets/tables for dangling filenames (blocks)
        run: |
          echo "Checking backtick-quoted filenames in doc bullets/tables —"
          echo "this is local and deterministic, so unlike link-check below"
          echo "it blocks the build on a real finding."
          python3 scripts/check_doc_references.py

      - name: Install markdown-link-check
        run: npm install -g markdown-link-check@3.13.6

      - name: Check all markdown files for broken links (report only)
        run: |
          echo "Checking markdown links across the repo (informational only)..."
          echo "Findings are reported for review but never fail the build —"
          echo "external link rot, rate limits, and third-party site changes"
          echo "are not 'real errors' in the sense this pipeline blocks on."
          echo
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            markdown-link-check \
              --config .markdown-link-check.json \
              "$file" || true
          done < <(find . -name "*.md" -not -path "./.git/*" -print0)

          echo
          echo "Markdown link check complete (see findings above for review)"
          exit 0
