# Example inventory for the devops-linux-lab.
#
# Copy this file to hosts.ini (gitignored) and adjust ansible_host values to
# match the IPs assigned in ../Vagrantfile (NETWORK_BASE + offsets), or
# generate it dynamically after `vagrant up` with your own tooling.
#
# ansible_host values below match the Vagrantfile defaults for NETWORK_BASE
# 192.168.56.0/24.

[k8s_master]
devops-1 ansible_host=192.168.56.10

[k8s_workers]
worker-1 ansible_host=192.168.56.11
worker-2 ansible_host=192.168.56.12

[k8s_cluster:children]
k8s_master
k8s_workers

[linux_labs]
ubuntu-lab ansible_host=192.168.56.20
rocky-lab  ansible_host=192.168.56.21
alma-lab   ansible_host=192.168.56.22
suse-lab   ansible_host=192.168.56.23

[ansible_practice]
node1 ansible_host=192.168.56.30
node2 ansible_host=192.168.56.31

[all:vars]
ansible_user=vagrant
# Point this at the private key Vagrant generated for the provider in use,
# e.g. .vagrant/machines/<name>/libvirt/private_key or
# .vagrant/machines/<name>/virtualbox/private_key. `vagrant ssh-config`
# will print the exact path per machine.
ansible_ssh_private_key_file=~/.ssh/id_rsa
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
